name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build plugins
        run: ./gradlew make
      - name: Collect artifacts
        run: |
          mkdir -p build-artifacts
          find . -name "*.cs3" -exec cp {} build-artifacts/ \;
          # Update plugins.json with correct file sizes
          for f in build-artifacts/*.cs3; do
            name=$(basename "$f" .cs3)
            size=$(stat --format=%s "$f")
            python3 -c "
import json
with open('plugins.json') as fp:
    data = json.load(fp)
for entry in data:
    if entry['internalName'] == '$name':
        entry['fileSize'] = $size
with open('plugins.json', 'w') as fp:
    json.dump(data, fp, indent=4)
    fp.write('\n')
"
          done
          cp plugins.json build-artifacts/
          cp repo.json build-artifacts/
          ls -la build-artifacts/
      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build-artifacts
          destination_dir: .
          publish_branch: builds
          keep_files: false
